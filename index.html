  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.js";

    const files = {"app.py": "\"\"\"Wireless Digital Signal Modulation and Transmission Simulator.\n\nInteractive Academic Web Application | Software-Based Digital Wireless Communication Simulator\nThis module provides a modern, high-aesthetic Streamlit simulation dashboard.\nIt models the complete end-to-end communication pipeline:\n1. Baseband UTF-8 text-to-binary encoding\n2. Digital carrier modulation (ASK, FSK, BPSK)\n3. Simulated AWGN channel degradation with tunable SNR\n4. Coherent matched-filter receiver demodulation\n5. Message recovery and Bit Error Rate (BER) analytics\n6. High-resolution oscilloscope waveform and bitstream visualizations\n\"\"\"\n\nimport io\nfrom typing import Any, Dict, List, Optional\nimport matplotlib.pyplot as plt\nimport numpy as np\nimport scipy.io.wavfile as wavfile\nimport streamlit as st\n\nfrom src.channel import add_awgn\nfrom src.demodulation import ask_demodulate, bpsk_demodulate, fsk_demodulate\nfrom src.encoding import bits_to_text, format_bits_for_display, text_to_bits\nfrom src.metrics import analyze_transmission\nfrom src.modulation import ask_modulate, bpsk_modulate, fsk_modulate\nfrom src.visualization import (\n    plot_bit_comparison,\n    plot_modulated_signal,\n    plot_received_signal,\n    plot_signal_comparison,\n)\n\n\ndef _generate_wav_bytes(waveform: np.ndarray, sample_rate: int = 10000) -> bytes:\n    \"\"\"Generate in-memory WAV audio bytes from a float waveform.\"\"\"\n    # Take at most 1 second of audio to keep playback snappy\n    max_len = min(len(waveform), sample_rate)\n    clip = waveform[:max_len]\n    max_val = np.max(np.abs(clip))\n    if max_val > 0:\n        norm_clip = clip / max_val\n    else:\n        norm_clip = clip\n    int16_data = (norm_clip * 30000.0).astype(np.int16)\n    buf = io.BytesIO()\n    wavfile.write(buf, sample_rate, int16_data)\n    return buf.getvalue()\n\n\ndef _inject_custom_styles() -> None:\n    \"\"\"Inject custom CSS design system with futuristic glassmorphic aesthetics.\"\"\"\n    st.markdown(\n        \"\"\"\n        <style>\n        /* Google Fonts Import */\n        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');\n\n        /* Global Typography */\n        html, body, [class*=\"css\"] {\n            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;\n            color: #f1f5f9;\n        }\n\n        h1, h2, h3, h4, h5, h6 {\n            font-family: 'Outfit', sans-serif !important;\n            letter-spacing: -0.02em;\n        }\n\n        code, pre, .stCodeBlock {\n            font-family: 'JetBrains Mono', monospace !important;\n        }\n\n        /* Hide Streamlit Deploy button and its modal trigger */\n        .stAppDeployButton,\n        [data-testid=\"stAppDeployButton\"],\n        div[data-testid=\"stAppDeployButton\"] {\n            display: none !important;\n            visibility: hidden !important;\n            opacity: 0 !important;\n            pointer-events: none !important;\n        }\n\n        /* Hero Header Banner */\n        .hero-banner {\n            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.8) 100%);\n            border: 1px solid rgba(56, 189, 248, 0.22);\n            border-radius: 20px;\n            padding: 28px 32px;\n            margin-bottom: 24px;\n            box-shadow: 0 16px 36px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);\n            position: relative;\n            overflow: hidden;\n        }\n\n        .hero-banner::before {\n            content: \"\";\n            position: absolute;\n            top: -50px;\n            right: -50px;\n            width: 200px;\n            height: 200px;\n            background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, rgba(0, 0, 0, 0) 70%);\n            border-radius: 50%;\n            pointer-events: none;\n        }\n\n        .hero-pill {\n            display: inline-flex;\n            align-items: center;\n            gap: 8px;\n            background: rgba(56, 189, 248, 0.12);\n            border: 1px solid rgba(56, 189, 248, 0.35);\n            color: #38bdf8;\n            padding: 4px 14px;\n            border-radius: 9999px;\n            font-size: 0.75rem;\n            font-weight: 700;\n            letter-spacing: 0.08em;\n            text-transform: uppercase;\n            margin-bottom: 12px;\n        }\n\n        .pulse-dot {\n            width: 7px;\n            height: 7px;\n            background-color: #38bdf8;\n            border-radius: 50%;\n            box-shadow: 0 0 10px #38bdf8;\n            animation: pulse-glow 2s infinite;\n        }\n\n        @keyframes pulse-glow {\n            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }\n            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(56, 189, 248, 0); }\n            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }\n        }\n\n        .hero-title {\n            font-size: 2.2rem;\n            font-weight: 800;\n            background: linear-gradient(90deg, #ffffff 0%, #cbd5e1 50%, #38bdf8 100%);\n            -webkit-background-clip: text;\n            -webkit-text-fill-color: transparent;\n            margin: 0 0 10px 0;\n            line-height: 1.2;\n        }\n\n        .hero-desc {\n            color: #94a3b8;\n            font-size: 0.95rem;\n            line-height: 1.55;\n            margin: 0 0 16px 0;\n            max-width: 900px;\n        }\n\n        .hero-chips {\n            display: flex;\n            flex-wrap: wrap;\n            gap: 10px;\n        }\n\n        .hero-chip {\n            background: rgba(2, 6, 23, 0.6);\n            border: 1px solid rgba(148, 163, 184, 0.15);\n            padding: 5px 12px;\n            border-radius: 8px;\n            font-size: 0.8rem;\n            color: #cbd5e1;\n            display: inline-flex;\n            align-items: center;\n            gap: 6px;\n        }\n\n        /* Glassmorphic Cards */\n        .glass-card {\n            background: rgba(15, 23, 42, 0.75);\n            backdrop-filter: blur(12px);\n            border: 1px solid rgba(56, 189, 248, 0.14);\n            border-radius: 16px;\n            padding: 20px 24px;\n            margin-bottom: 20px;\n            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);\n            transition: border-color 0.25s ease, transform 0.25s ease;\n        }\n\n        .glass-card:hover {\n            border-color: rgba(56, 189, 248, 0.35);\n        }\n\n        .card-header-title {\n            font-size: 1.05rem;\n            font-weight: 700;\n            color: #f8fafc;\n            display: flex;\n            align-items: center;\n            gap: 8px;\n            margin-bottom: 14px;\n        }\n\n        /* Status & Metric Badges */\n        .badge-success {\n            background: rgba(16, 185, 129, 0.15);\n            border: 1px solid rgba(16, 185, 129, 0.35);\n            color: #34d399;\n            padding: 4px 10px;\n            border-radius: 6px;\n            font-size: 0.75rem;\n            font-weight: 600;\n        }\n\n        .badge-warning {\n            background: rgba(245, 158, 11, 0.15);\n            border: 1px solid rgba(245, 158, 11, 0.35);\n            color: #fbbf24;\n            padding: 4px 10px;\n            border-radius: 6px;\n            font-size: 0.75rem;\n            font-weight: 600;\n        }\n\n        .badge-error {\n            background: rgba(239, 68, 68, 0.15);\n            border: 1px solid rgba(239, 68, 68, 0.35);\n            color: #f87171;\n            padding: 4px 10px;\n            border-radius: 6px;\n            font-size: 0.75rem;\n            font-weight: 600;\n        }\n\n        /* KPI Metric Cards Grid */\n        .kpi-container {\n            display: grid;\n            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));\n            gap: 12px;\n            margin: 16px 0;\n        }\n\n        .kpi-card {\n            background: rgba(11, 19, 41, 0.85);\n            border: 1px solid rgba(56, 189, 248, 0.18);\n            border-radius: 12px;\n            padding: 14px 16px;\n            text-align: center;\n            transition: all 0.2s ease;\n        }\n\n        .kpi-card:hover {\n            border-color: #38bdf8;\n            transform: translateY(-2px);\n        }\n\n        .kpi-label {\n            font-size: 0.72rem;\n            text-transform: uppercase;\n            letter-spacing: 0.05em;\n            color: #94a3b8;\n            margin-bottom: 4px;\n        }\n\n        .kpi-val {\n            font-size: 1.4rem;\n            font-weight: 700;\n            font-family: 'Outfit', sans-serif;\n            color: #ffffff;\n        }\n\n        .kpi-sub {\n            font-size: 0.7rem;\n            color: #64748b;\n            margin-top: 2px;\n        }\n\n        /* Primary Button Styling */\n        div.stButton > button[kind=\"primary\"] {\n            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%) !important;\n            border: 1px solid #38bdf8 !important;\n            color: #ffffff !important;\n            font-weight: 700 !important;\n            font-size: 1.05rem !important;\n            padding: 0.65rem 1.5rem !important;\n            border-radius: 12px !important;\n            box-shadow: 0 6px 20px -4px rgba(2, 132, 199, 0.5) !important;\n            transition: all 0.25s ease !important;\n        }\n\n        div.stButton > button[kind=\"primary\"]:hover {\n            background: linear-gradient(135deg, #0369a1 0%, #1d4ed8 100%) !important;\n            box-shadow: 0 8px 25px -3px rgba(56, 189, 248, 0.7) !important;\n            transform: translateY(-1px) !important;\n        }\n\n        /* Preset Scenario Buttons */\n        .preset-container {\n            display: flex;\n            gap: 8px;\n            margin-bottom: 16px;\n            flex-wrap: wrap;\n        }\n\n        /* Monospace Bit Container */\n        .bitstream-box {\n            background: #020617;\n            border: 1px solid #1e293b;\n            border-radius: 10px;\n            padding: 12px 14px;\n            font-family: 'JetBrains Mono', monospace;\n            font-size: 0.85rem;\n            color: #38bdf8;\n            max-height: 120px;\n            overflow-y: auto;\n            word-break: break-all;\n            line-height: 1.6;\n        }\n\n        /* Footer */\n        .footer-text {\n            text-align: center;\n            color: #64748b;\n            font-size: 0.85rem;\n            margin-top: 36px;\n            padding-bottom: 20px;\n        }\n        </style>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n\ndef _render_hero_header() -> None:\n    \"\"\"Render high-tech header banner with academic and telemetry highlights.\"\"\"\n    st.markdown(\n        \"\"\"\n        <div class=\"hero-banner\">\n            <div class=\"hero-pill\">\n                <span class=\"pulse-dot\"></span> Signal Telemetry Online \u2022 Academic Lab v1.2\n            </div>\n            <h1 class=\"hero-title\">Wireless Signal Modulation & Transmission Simulator</h1>\n            <p class=\"hero-desc\">\n                An end-to-end computational laboratory modeling the fundamental stages of digital wireless telecommunication:\n                Baseband UTF-8 encoding, sinusoidal carrier modulation (<strong>ASK</strong>, <strong>FSK</strong>, <strong>BPSK</strong>),\n                stochastic <strong>AWGN channel propagation</strong>, coherent matched-filter demodulation,\n                and quantitative <strong>Bit Error Rate (BER)</strong> evaluation.\n            </p>\n            <div class=\"hero-chips\">\n                <div class=\"hero-chip\">\ud83d\udce1 <strong>Carrier:</strong> 1000 Hz / 1500 Hz</div>\n                <div class=\"hero-chip\">\u26a1 <strong>Sampling Rate:</strong> 10,000 Hz</div>\n                <div class=\"hero-chip\">\ud83d\udcf6 <strong>Symbol Rate:</strong> 1000 Baud</div>\n                <div class=\"hero-chip\">\ud83c\udf9b\ufe0f <strong>Modes:</strong> ASK \u2022 FSK \u2022 BPSK</div>\n                <div class=\"hero-chip\">\ud83d\udef0\ufe0f <strong>Channel:</strong> AWGN (0 \u2013 30 dB)</div>\n                <div class=\"hero-chip\">\ud83d\udcbb <strong>Purity:</strong> 100% Software Math (No RF Hardware)</div>\n            </div>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n\ndef main() -> None:\n    \"\"\"Render the enhanced Streamlit user interface and simulation dashboard.\"\"\"\n    # -------------------------------------------------------------------------\n    # Page Configuration & Styles\n    # -------------------------------------------------------------------------\n    st.set_page_config(\n        page_title=\"Wireless Signal Modulation & Transmission Simulator\",\n        page_icon=\"\ud83d\udce1\",\n        layout=\"wide\",\n        initial_sidebar_state=\"expanded\",\n    )\n\n    _inject_custom_styles()\n    _render_hero_header()\n\n    # Initialize session state keys if not present\n    if \"input_message\" not in st.session_state:\n        st.session_state[\"input_message\"] = \"Hello Wireless World!\"\n    if \"modulation_index\" not in st.session_state:\n        st.session_state[\"modulation_index\"] = 0\n    if \"snr_slider_val\" not in st.session_state:\n        st.session_state[\"snr_slider_val\"] = 20\n\n    # -------------------------------------------------------------------------\n    # Main 2-Column Responsive Layout\n    # -------------------------------------------------------------------------\n    col_input, col_results = st.columns([1, 1.08], gap=\"large\")\n\n    # =========================================================================\n    # LEFT COLUMN: Transmission Configuration & Transmitter Controls\n    # =========================================================================\n    with col_input:\n        st.markdown(\n            \"\"\"\n            <div class=\"card-header-title\">\n                \u2699\ufe0f <span>Transmission Control Station</span>\n            </div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n\n        # ---------------------------------------------------------------------\n        # Quick-Pick Educational Presets\n        # ---------------------------------------------------------------------\n        st.markdown(\"###### \ud83c\udfaf Quick-Pick Simulation Scenarios\")\n        col_p1, col_p2, col_p3, col_p4 = st.columns(4)\n\n        with col_p1:\n            if st.button(\"\u26a1 Clean BPSK\", help=\"BPSK @ 25 dB: High immunity, 0 errors\", use_container_width=True):\n                st.session_state[\"input_message\"] = \"Wireless Telemetry 2026\"\n                st.session_state[\"modulation_index\"] = 2  # BPSK\n                st.session_state[\"snr_slider_val\"] = 25\n                st.rerun()\n\n        with col_p2:\n            if st.button(\"\ud83c\udf2a\ufe0f Noisy FSK\", help=\"FSK @ 10 dB: Moderate channel degradation\", use_container_width=True):\n                st.session_state[\"input_message\"] = \"Deep Space Probe #7\"\n                st.session_state[\"modulation_index\"] = 1  # FSK\n                st.session_state[\"snr_slider_val\"] = 10\n                st.rerun()\n\n        with col_p3:\n            if st.button(\"\u26a0\ufe0f Extreme ASK\", help=\"ASK @ 3 dB: Severe amplitude noise & bit flips\", use_container_width=True):\n                st.session_state[\"input_message\"] = \"Signal Alert: High AWGN\"\n                st.session_state[\"modulation_index\"] = 0  # ASK\n                st.session_state[\"snr_slider_val\"] = 3\n                st.rerun()\n\n        with col_p4:\n            if st.button(\"\ud83c\udf10 Multilingual\", help=\"Unicode & Emojis @ 22 dB\", use_container_width=True):\n                st.session_state[\"input_message\"] = \"Hello \ud83c\udf0d! \ud83d\udef0\ufe0f Signal\"\n                st.session_state[\"modulation_index\"] = 2  # BPSK\n                st.session_state[\"snr_slider_val\"] = 22\n                st.rerun()\n\n        st.markdown(\"<div style='height: 10px;'></div>\", unsafe_allow_html=True)\n\n        # ---------------------------------------------------------------------\n        # 1. Message Input Section\n        # ---------------------------------------------------------------------\n        with st.container(border=True):\n            st.markdown(\"##### 1. Baseband Message Input\")\n            message_input = st.text_area(\n                label=\"Message to Transmit (UTF-8 Plaintext):\",\n                value=st.session_state[\"input_message\"],\n                placeholder=\"Type your message here...\",\n                height=95,\n                help=\"Enter any alphanumeric text, punctuation, symbols, or Unicode characters.\",\n            )\n\n            # Keep session state updated with user edits\n            st.session_state[\"input_message\"] = message_input\n\n            char_count = len(message_input)\n            byte_count = len(message_input.encode(\"utf-8\"))\n            bit_count = byte_count * 8\n\n            col_sub1, col_sub2, col_sub3 = st.columns(3)\n            with col_sub1:\n                st.caption(f\"\ud83d\udcdd Characters: **{char_count}**\")\n            with col_sub2:\n                st.caption(f\"\ud83d\udcbe UTF-8 Bytes: **{byte_count}**\")\n            with col_sub3:\n                st.caption(f\"\ud83d\udd22 Total Bits: **{bit_count}**\")\n\n        # ---------------------------------------------------------------------\n        # 2. Modulation Selection Section\n        # ---------------------------------------------------------------------\n        with st.container(border=True):\n            st.markdown(\"##### 2. Carrier Modulation Scheme\")\n            modulation_options = [\n                \"ASK \u2014 Amplitude Shift Keying (fc = 1000 Hz)\",\n                \"FSK \u2014 Frequency Shift Keying (f0 = 500 Hz, f1 = 1500 Hz)\",\n                \"BPSK \u2014 Binary Phase Shift Keying (fc = 1000 Hz, \u0394\u03b8 = 180\u00b0)\",\n            ]\n\n            selected_modulation = st.radio(\n                label=\"Select Digital Modulation Scheme:\",\n                options=modulation_options,\n                index=st.session_state[\"modulation_index\"],\n                help=\"Choose which wave characteristic (amplitude, frequency, or phase) is modulated by binary bits.\",\n            )\n            # Sync index\n            st.session_state[\"modulation_index\"] = modulation_options.index(selected_modulation)\n\n            if selected_modulation.startswith(\"ASK\"):\n                mod_badge = \"<span class='badge-warning'>Amplitude Modulated</span>\"\n                mod_desc = (\n                    \"\u2022 <strong>Bit 1:</strong> Transmits carrier wave at amplitude <code>1.0</code>.<br>\"\n                    \"\u2022 <strong>Bit 0:</strong> Zero carrier transmission (On-Off Keying).<br>\"\n                    \"\u2022 <strong>Receiver:</strong> Matched-filter correlation with threshold <code>A / 2</code>.<br>\"\n                    \"\u2022 <strong>Vulnerability:</strong> High susceptibility to additive amplitude noise.\"\n                )\n            elif selected_modulation.startswith(\"FSK\"):\n                mod_badge = \"<span class='badge-success'>Frequency Modulated</span>\"\n                mod_desc = (\n                    \"\u2022 <strong>Bit 0:</strong> Carrier at <code>f0 = 500 Hz</code>.<br>\"\n                    \"\u2022 <strong>Bit 1:</strong> Carrier at <code>f1 = 1500 Hz</code>.<br>\"\n                    \"\u2022 <strong>Receiver:</strong> Dual-branch coherent correlation with tone energy detector.<br>\"\n                    \"\u2022 <strong>Resilience:</strong> Constant envelope protects against amplitude variations.\"\n                )\n            else:\n                mod_badge = \"<span class='badge-success'>Phase Modulated (Optimum)</span>\"\n                mod_desc = (\n                    \"\u2022 <strong>Bit 1:</strong> Phase at <code>0\u00b0</code> (<code>+sin(2\u03c0fc t)</code>).<br>\"\n                    \"\u2022 <strong>Bit 0:</strong> Phase at <code>180\u00b0</code> (<code>-sin(2\u03c0fc t)</code>).<br>\"\n                    \"\u2022 <strong>Receiver:</strong> Coherent correlation with zero-crossing threshold.<br>\"\n                    \"\u2022 <strong>Efficiency:</strong> Theoretical maximum power efficiency and lowest BER in AWGN.\"\n                )\n\n            st.markdown(\n                f\"\"\"\n                <div style=\"background: rgba(2, 6, 23, 0.5); border: 1px solid rgba(56, 189, 248, 0.15); border-radius: 10px; padding: 12px 14px; margin-top: 8px;\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n                        <span style=\"font-size: 0.82rem; font-weight: 600; color: #cbd5e1;\">Scheme Characteristics:</span>\n                        {mod_badge}\n                    </div>\n                    <div style=\"font-size: 0.82rem; color: #94a3b8; line-height: 1.5;\">\n                        {mod_desc}\n                    </div>\n                </div>\n                \"\"\",\n                unsafe_allow_html=True,\n            )\n\n        # ---------------------------------------------------------------------\n        # 3. Channel Settings Section\n        # ---------------------------------------------------------------------\n        with st.container(border=True):\n            st.markdown(\"##### 3. Wireless Channel Propagation (AWGN)\")\n\n            snr_value = st.slider(\n                label=\"Channel Signal-to-Noise Ratio (SNR) in dB:\",\n                min_value=0,\n                max_value=30,\n                value=st.session_state[\"snr_slider_val\"],\n                step=1,\n                help=\"Adjust the ratio of signal power to noise power. Higher SNR simulates a cleaner channel.\",\n            )\n            st.session_state[\"snr_slider_val\"] = snr_value\n\n            if snr_value >= 20:\n                channel_quality_html = \"\"\"\n                <span class=\"badge-success\">\ud83d\udfe2 Pristine Channel (20\u201330 dB)</span>\n                <span style=\"font-size: 0.8rem; color: #94a3b8;\">Near-zero or 0 bit errors expected.</span>\n                \"\"\"\n            elif snr_value >= 10:\n                channel_quality_html = \"\"\"\n                <span class=\"badge-warning\">\ud83d\udfe1 Moderate Channel Noise (10\u201319 dB)</span>\n                <span style=\"font-size: 0.8rem; color: #94a3b8;\">Occasional bit flips depending on modulation.</span>\n                \"\"\"\n            else:\n                channel_quality_html = \"\"\"\n                <span class=\"badge-error\">\ud83d\udd34 Severe Impairment (0\u20139 dB)</span>\n                <span style=\"font-size: 0.8rem; color: #94a3b8;\">High BER; frequent byte corruption anticipated.</span>\n                \"\"\"\n\n            st.markdown(\n                f\"\"\"\n                <div style=\"display: flex; align-items: center; justify-content: space-between; background: rgba(2, 6, 23, 0.5); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(148, 163, 184, 0.1); margin-top: 6px;\">\n                    {channel_quality_html}\n                </div>\n                \"\"\",\n                unsafe_allow_html=True,\n            )\n\n        # ---------------------------------------------------------------------\n        # Transmit Button\n        # ---------------------------------------------------------------------\n        transmit_clicked = st.button(\n            \"\ud83d\ude80 Transmit Signal & Simulate Channel\",\n            type=\"primary\",\n            use_container_width=True,\n        )\n\n        # Handle simulation execution\n        if transmit_clicked:\n            trimmed_message = message_input.strip()\n            if not trimmed_message:\n                st.session_state[\"simulation_active\"] = False\n                st.session_state[\"last_submitted_text\"] = \"\"\n                st.error(\"\u26a0\ufe0f **Validation Error:** Please enter a valid non-empty text message.\")\n            else:\n                try:\n                    # 1. Text to binary conversion\n                    tx_bits = text_to_bits(trimmed_message)\n\n                    # 2. Modulate bits into digital carrier waveform\n                    if selected_modulation.startswith(\"ASK\"):\n                        tx_waveform = ask_modulate(tx_bits)\n                        mod_code = \"ASK\"\n                    elif selected_modulation.startswith(\"FSK\"):\n                        tx_waveform = fsk_modulate(tx_bits)\n                        mod_code = \"FSK\"\n                    elif selected_modulation.startswith(\"BPSK\"):\n                        tx_waveform = bpsk_modulate(tx_bits)\n                        mod_code = \"BPSK\"\n                    else:\n                        raise ValueError(f\"Unknown modulation: {selected_modulation}\")\n\n                    duration_s = len(tx_waveform) / 10000.0\n\n                    # 3. Channel AWGN noise injection\n                    rx_noisy_waveform = add_awgn(tx_waveform, snr_db=float(snr_value))\n\n                    # 4. Receiver demodulation\n                    if mod_code == \"ASK\":\n                        rx_bits = ask_demodulate(rx_noisy_waveform)\n                    elif mod_code == \"FSK\":\n                        rx_bits = fsk_demodulate(rx_noisy_waveform)\n                    elif mod_code == \"BPSK\":\n                        rx_bits = bpsk_demodulate(rx_noisy_waveform)\n\n                    # 5. Message decoding from recovered bits\n                    decode_success = True\n                    decode_error_msg = \"\"\n                    try:\n                        recovered_text = bits_to_text(rx_bits)\n                    except UnicodeDecodeError as ude:\n                        decode_success = False\n                        recovered_text = \"\"\n                        decode_error_msg = f\"UTF-8 Decoding Error: Noise altered byte parity ({ude.reason}).\"\n                    except Exception as exc:\n                        decode_success = False\n                        recovered_text = \"\"\n                        decode_error_msg = f\"Decoding Exception: {exc}\"\n\n                    # 6. Quantitative metrics\n                    try:\n                        metrics_summary = analyze_transmission(tx_bits, rx_bits)\n                    except Exception as m_err:\n                        metrics_summary = {\n                            \"total_bits\": len(tx_bits),\n                            \"recovered_bits\": len(rx_bits),\n                            \"bit_errors\": -1,\n                            \"ber\": -1.0,\n                            \"accuracy_percent\": -1.0,\n                            \"error\": str(m_err),\n                        }\n\n                    # Store simulation state\n                    st.session_state[\"simulation_active\"] = True\n                    st.session_state[\"last_submitted_text\"] = message_input\n                    st.session_state[\"tx_message\"] = trimmed_message\n                    st.session_state[\"tx_bits\"] = tx_bits\n                    st.session_state[\"tx_waveform\"] = tx_waveform\n                    st.session_state[\"rx_noisy_waveform\"] = rx_noisy_waveform\n                    st.session_state[\"rx_bits\"] = rx_bits\n                    st.session_state[\"recovered_text\"] = recovered_text\n                    st.session_state[\"decode_success\"] = decode_success\n                    st.session_state[\"decode_error_msg\"] = decode_error_msg\n                    st.session_state[\"metrics\"] = metrics_summary\n                    st.session_state[\"mod_code\"] = mod_code\n                    st.session_state[\"mod_name\"] = selected_modulation\n                    st.session_state[\"duration_s\"] = duration_s\n                    st.session_state[\"snr_db\"] = snr_value\n\n                except Exception as exc:\n                    st.session_state[\"simulation_active\"] = False\n                    st.error(f\"\u26a0\ufe0f **Simulation Error:** {exc}\")\n\n        # Check if the text input has been modified since the last submission\n        last_submitted = st.session_state.get(\"last_submitted_text\", None)\n        simulation_active = st.session_state.get(\"simulation_active\", False)\n\n        if simulation_active and message_input != last_submitted:\n            st.warning(\n                \"\u26a0\ufe0f **Input Modified:** The text in the input box has changed. \"\n                \"Click **\ud83d\ude80 Transmit Signal** to refresh the simulation.\",\n                icon=\"\u26a0\ufe0f\",\n            )\n            simulation_active = False\n\n    # =========================================================================\n    # RIGHT COLUMN: Results Dashboard, Telemetry & Oscilloscope\n    # =========================================================================\n    with col_results:\n        st.markdown(\n            \"\"\"\n            <div class=\"card-header-title\">\n                \ud83d\udcca <span>Receiver Telemetry & Analytics Dashboard</span>\n            </div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n\n        if simulation_active:\n            m = st.session_state.get(\"metrics\", {})\n            orig_msg = st.session_state[\"tx_message\"]\n            rec_msg = st.session_state[\"recovered_text\"]\n            decode_ok = st.session_state[\"decode_success\"]\n            err_msg = st.session_state[\"decode_error_msg\"]\n            mod_code = st.session_state[\"mod_code\"]\n            snr_cur = st.session_state[\"snr_db\"]\n            bit_errors = m.get(\"bit_errors\", 0)\n            ber = m.get(\"ber\", 0.0)\n            accuracy = m.get(\"accuracy_percent\", 100.0)\n\n            # -----------------------------------------------------------------\n            # Live Status Alert Banner\n            # -----------------------------------------------------------------\n            if bit_errors == 0 and decode_ok:\n                st.markdown(\n                    f\"\"\"\n                    <div style=\"background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.35); border-radius: 12px; padding: 12px 18px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;\">\n                        <div style=\"display: flex; align-items: center; gap: 10px;\">\n                            <span style=\"font-size: 1.3rem;\">\ud83c\udfaf</span>\n                            <div>\n                                <div style=\"font-weight: 700; color: #34d399; font-size: 0.95rem;\">PERFECT TRANSMISSION & RECOVERY</div>\n                                <div style=\"font-size: 0.8rem; color: #94a3b8;\">100.0% Bit Accuracy \u2022 0 Bit Flips \u2022 Modulation: {mod_code} at {snr_cur} dB SNR</div>\n                            </div>\n                        </div>\n                        <span class=\"badge-success\">0 ERRORS</span>\n                    </div>\n                    \"\"\",\n                    unsafe_allow_html=True,\n                )\n            elif decode_ok:\n                st.markdown(\n                    f\"\"\"\n                    <div style=\"background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 12px; padding: 12px 18px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;\">\n                        <div style=\"display: flex; align-items: center; gap: 10px;\">\n                            <span style=\"font-size: 1.3rem;\">\u26a0\ufe0f</span>\n                            <div>\n                                <div style=\"font-weight: 700; color: #fbbf24; font-size: 0.95rem;\">PARTIAL TRANSMISSION RECOVERY</div>\n                                <div style=\"font-size: 0.8rem; color: #94a3b8;\">{bit_errors} bit errors occurred (BER = {ber:.4f}) \u2022 Text recovered with minor alterations</div>\n                            </div>\n                        </div>\n                        <span class=\"badge-warning\">{accuracy:.1f}% ACCURACY</span>\n                    </div>\n                    \"\"\",\n                    unsafe_allow_html=True,\n                )\n            else:\n                st.markdown(\n                    f\"\"\"\n                    <div style=\"background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 12px; padding: 12px 18px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;\">\n                        <div style=\"display: flex; align-items: center; gap: 10px;\">\n                            <span style=\"font-size: 1.3rem;\">\ud83d\udca5</span>\n                            <div>\n                                <div style=\"font-weight: 700; color: #f87171; font-size: 0.95rem;\">SEVERE CHANNEL DEGRADATION</div>\n                                <div style=\"font-size: 0.8rem; color: #94a3b8;\">{bit_errors} bit flips corrupted byte boundaries \u2022 {err_msg}</div>\n                            </div>\n                        </div>\n                        <span class=\"badge-error\">{accuracy:.1f}% ACCURACY</span>\n                    </div>\n                    \"\"\",\n                    unsafe_allow_html=True,\n                )\n\n            # -----------------------------------------------------------------\n            # KPI Cards Grid\n            # -----------------------------------------------------------------\n            st.markdown(\n                f\"\"\"\n                <div class=\"kpi-container\">\n                    <div class=\"kpi-card\">\n                        <div class=\"kpi-label\">Transmitted</div>\n                        <div class=\"kpi-val\" style=\"color: #38bdf8;\">{m['total_bits']}</div>\n                        <div class=\"kpi-sub\">Total Bits (Tx)</div>\n                    </div>\n                    <div class=\"kpi-card\">\n                        <div class=\"kpi-label\">Demodulated</div>\n                        <div class=\"kpi-val\" style=\"color: #cbd5e1;\">{m['recovered_bits']}</div>\n                        <div class=\"kpi-sub\">Bits Received</div>\n                    </div>\n                    <div class=\"kpi-card\">\n                        <div class=\"kpi-label\">Bit Errors</div>\n                        <div class=\"kpi-val\" style=\"color: {'#34d399' if bit_errors == 0 else '#f87171'};\">{bit_errors}</div>\n                        <div class=\"kpi-sub\">Mismatched Bits</div>\n                    </div>\n                    <div class=\"kpi-card\">\n                        <div class=\"kpi-label\">BER</div>\n                        <div class=\"kpi-val\" style=\"color: {'#34d399' if ber == 0 else '#fbbf24'};\">{ber:.4f}</div>\n                        <div class=\"kpi-sub\">Bit Error Rate</div>\n                    </div>\n                    <div class=\"kpi-card\">\n                        <div class=\"kpi-label\">Accuracy</div>\n                        <div class=\"kpi-val\" style=\"color: {'#34d399' if accuracy == 100 else '#38bdf8'};\">{accuracy:.1f}%</div>\n                        <div class=\"kpi-sub\">Transmission Health</div>\n                    </div>\n                </div>\n                \"\"\",\n                unsafe_allow_html=True,\n            )\n\n            # Accuracy Progress Bar\n            st.progress(max(0.0, min(1.0, float(accuracy) / 100.0)))\n\n            # -----------------------------------------------------------------\n            # Side-by-Side Message Comparison Cards\n            # -----------------------------------------------------------------\n            col_msg_tx, col_msg_rx = st.columns(2)\n            with col_msg_tx:\n                with st.container(border=True):\n                    st.markdown(\"###### \ud83d\udce4 Original Transmitted Message\")\n                    st.code(orig_msg, language=\"text\")\n                    st.caption(f\"Encoding: **UTF-8** \u2022 Length: **{len(orig_msg)} characters**\")\n\n            with col_msg_rx:\n                with st.container(border=True):\n                    st.markdown(\"###### \ud83d\udce5 Demodulated Recovered Message\")\n                    if decode_ok:\n                        st.code(rec_msg, language=\"text\")\n                        if rec_msg == orig_msg:\n                            st.caption(\"\u2705 **Identical Content:** Perfect string equality.\")\n                        else:\n                            st.caption(\"\u26a0\ufe0f **Altered:** Noise changed 1 or more characters.\")\n                    else:\n                        st.error(\"\u26a0\ufe0f Byte framing error: Corrupted by AWGN noise.\")\n                        st.caption(\"Raw bitstream recovered below remains available.\")\n\n            # -----------------------------------------------------------------\n            # Audio Carrier Listening Synthesizer\n            # -----------------------------------------------------------------\n            with st.container(border=True):\n                col_aud1, col_aud2 = st.columns([1.2, 1])\n                with col_aud1:\n                    st.markdown(\"###### \ud83c\udfa7 Audible Carrier Waveform Synthesizer\")\n                    st.caption(\n                        \"Listen to the audible carrier wave synthesized directly from your simulated signal samples (10 kHz sampling). \"\n                        \"Notice the pitch difference in FSK, envelope pauses in ASK, and phase shifts in BPSK.\"\n                    )\n                with col_aud2:\n                    tx_waveform = st.session_state[\"tx_waveform\"]\n                    audio_wav_bytes = _generate_wav_bytes(tx_waveform, sample_rate=10000)\n                    st.audio(audio_wav_bytes, format=\"audio/wav\")\n\n            # -----------------------------------------------------------------\n            # Visual Oscilloscope Waveform & Bitstream Tabs\n            # -----------------------------------------------------------------\n            with st.container(border=True):\n                st.markdown(\"##### \ud83d\udd2c Oscilloscope Waveform Visualizations\")\n                rx_noisy = st.session_state[\"rx_noisy_waveform\"]\n                tx_bits = st.session_state[\"tx_bits\"]\n                rx_bits = st.session_state[\"rx_bits\"]\n                sample_rate = 10000.0\n\n                # Max samples to plot for clear sinusoidal resolution\n                plot_samples = min(800, len(tx_waveform))\n                plot_bits_count = min(64, len(tx_bits))\n\n                tab_tx, tab_rx, tab_comp, tab_bits, tab_raw = st.tabs([\n                    \"\ud83d\udce1 Transmitted Signal\",\n                    \"\u26a1 Channel Output (AWGN)\",\n                    \"\ud83d\udd0d Dual-Trace Comparison\",\n                    \"\ud83d\udd22 Bit Step Plot\",\n                    \"\ud83d\udcbe Raw Bitstreams\",\n                ])\n\n                with tab_tx:\n                    fig_tx = plot_modulated_signal(\n                        tx_waveform,\n                        sample_rate=sample_rate,\n                        title=f\"{mod_code} Modulated Carrier Waveform (Transmitter Output)\",\n                        max_samples=plot_samples,\n                    )\n                    st.pyplot(fig_tx)\n                    plt.close(fig_tx)\n                    st.caption(\n                        f\"Displaying first **{plot_samples} samples** ({plot_samples / sample_rate * 1000:.1f} ms) \"\n                        f\"out of {len(tx_waveform)} total samples for high-resolution sinusoidal wave inspection.\"\n                    )\n\n                with tab_rx:\n                    fig_rx = plot_received_signal(\n                        rx_noisy,\n                        sample_rate=sample_rate,\n                        title=f\"Received {mod_code} Signal with Simulated AWGN Noise (SNR = {snr_cur} dB)\",\n                        max_samples=plot_samples,\n                    )\n                    st.pyplot(fig_rx)\n                    plt.close(fig_rx)\n                    st.caption(\n                        f\"Noisy waveform after traveling through AWGN channel with SNR = **{snr_cur} dB**.\"\n                    )\n\n                with tab_comp:\n                    fig_comp = plot_signal_comparison(\n                        tx_waveform,\n                        rx_noisy,\n                        sample_rate=sample_rate,\n                        max_samples=plot_samples,\n                    )\n                    st.pyplot(fig_comp)\n                    plt.close(fig_comp)\n                    st.caption(\n                        \"Synchronized dual-trace display showing clean carrier (top) vs. noise-corrupted signal with reference overlay (bottom).\"\n                    )\n\n                with tab_bits:\n                    fig_bits = plot_bit_comparison(\n                        tx_bits,\n                        rx_bits,\n                        max_bits=plot_bits_count,\n                    )\n                    st.pyplot(fig_bits)\n                    plt.close(fig_bits)\n                    st.caption(\n                        f\"Synchronized digital step plot for first **{plot_bits_count} bits**. \"\n                        \"Vibrant red 'X' markers pinpoint specific bit flip errors caused by channel noise.\"\n                    )\n\n                with tab_raw:\n                    st.markdown(\"###### Transmitted Bitstream (UTF-8 Bytes):\")\n                    st.code(format_bits_for_display(tx_bits), language=\"text\")\n                    st.markdown(\"###### Demodulated Bitstream:\")\n                    st.code(format_bits_for_display(rx_bits), language=\"text\")\n        else:\n            # Empty / Awaiting Transmission Placeholder\n            st.markdown(\n                \"\"\"\n                <div style=\"background: rgba(15, 23, 42, 0.4); border: 1px dashed rgba(56, 189, 248, 0.25); border-radius: 16px; padding: 48px 24px; text-align: center;\">\n                    <div style=\"font-size: 3rem; margin-bottom: 12px;\">\ud83d\udce1</div>\n                    <div style=\"font-size: 1.15rem; font-weight: 700; color: #f1f5f9; margin-bottom: 6px;\">\n                        Awaiting Transmission Sequence\n                    </div>\n                    <div style=\"font-size: 0.88rem; color: #94a3b8; max-width: 440px; margin: 0 auto 20px auto; line-height: 1.5;\">\n                        Configure your message, modulation scheme, and channel SNR on the left, then click\n                        <strong>Transmit Signal</strong> or select a <strong>Quick-Pick Scenario</strong> above to run the simulation.\n                    </div>\n                    <div style=\"display: inline-flex; gap: 8px; font-size: 0.8rem; color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 6px 14px; border-radius: 9999px;\">\n                        \u26a1 Matched Filters Ready \u2022 AWGN Channel Standing By\n                    </div>\n                </div>\n                \"\"\",\n                unsafe_allow_html=True,\n            )\n\n    st.divider()\n\n    # -------------------------------------------------------------------------\n    # Educational Theory Section\n    # -------------------------------------------------------------------------\n    with st.expander(\"\ud83d\udcda Digital Modulation Theory & Analytical Mathematical Principles\", expanded=False):\n        col_ask_th, col_fsk_th, col_bpsk_th = st.columns(3)\n\n        with col_ask_th:\n            st.markdown(\n                \"\"\"\n                #### Amplitude Shift Keying (ASK)\n                $$s(t) = \\\\begin{cases} A\\\\sin(2\\\\pi f_c t), & \\\\text{bit} = 1 \\\\\\\\ 0, & \\\\text{bit} = 0 \\\\end{cases}$$\n                - **Carrier ($f_c$):** 1000 Hz\n                - **Decision Rule:** $r_k \\\\ge \\\\frac{A}{2} \\\\sum \\\\sin^2(2\\\\pi f_c t) \\\\implies 1$\n                - **Trade-off:** Minimal circuit complexity, but highest sensitivity to channel noise and amplitude fading.\n                \"\"\"\n            )\n\n        with col_fsk_th:\n            st.markdown(\n                \"\"\"\n                #### Frequency Shift Keying (FSK)\n                $$s(t) = A\\\\sin(2\\\\pi f_b t), \\\\quad f_b \\\\in \\\\{500\\\\text{ Hz}, 1500\\\\text{ Hz}\\\\}$$\n                - **Tones ($f_0, f_1$):** 500 Hz (bit 0) vs. 1500 Hz (bit 1)\n                - **Decision Rule:** $\\\\sum y[n]\\\\sin(2\\\\pi f_1 t) > \\\\sum y[n]\\\\sin(2\\\\pi f_0 t) \\\\implies 1$\n                - **Trade-off:** Constant envelope provides superior immunity against amplitude perturbations.\n                \"\"\"\n            )\n\n        with col_bpsk_th:\n            st.markdown(\n                \"\"\"\n                #### Binary Phase Shift Keying (BPSK)\n                $$s(t) = \\\\begin{cases} +A\\\\sin(2\\\\pi f_c t), & \\\\text{bit} = 1 \\\\\\\\ -A\\\\sin(2\\\\pi f_c t), & \\\\text{bit} = 0 \\\\end{cases}$$\n                - **Phase Shift:** $\\\\Delta\\\\theta = 180^\\\\circ$ ($\\\\pi$ radians)\n                - **Decision Rule:** Correlate with carrier; zero-crossing boundary ($r_k \\\\ge 0 \\\\implies 1$)\n                - **Trade-off:** Optimum power efficiency and lowest theoretical Bit Error Rate in AWGN.\n                \"\"\"\n            )\n\n        st.markdown(\"---\")\n        st.markdown(\n            \"\"\"\n            ##### Signal-to-Noise Ratio (SNR) & AWGN Formulation\n            $$\\\\text{SNR}_{\\\\text{linear}} = 10^{\\\\frac{\\\\text{SNR}_{\\\\text{dB}}}{10}}, \\\\quad P_{\\\\text{noise}} = \\\\frac{P_{\\\\text{signal}}}{\\\\text{SNR}_{\\\\text{linear}}}, \\\\quad w[n] \\\\sim \\\\mathcal{N}(0, P_{\\\\text{noise}})$$\n            All signal waveforms and noise samples are generated dynamically using discrete-time double-precision floating-point arithmetic.\n            \"\"\"\n        )\n\n    # -------------------------------------------------------------------------\n    # Footer\n    # -------------------------------------------------------------------------\n    st.markdown(\n        \"\"\"\n        <div class=\"footer-text\">\n            \ud83d\udce1 <strong>Wireless Digital Signal Modulation and Transmission Simulator</strong><br>\n            Academic Mini-Project | Software-Only Simulation | Developed with Python, Streamlit, NumPy, SciPy & Matplotlib\n        </div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n", "src/__init__.py": "\"\"\"Source package for Wireless Signal Simulator.\"\"\"\n", "src/channel.py": "\"\"\"Simulated wireless communication channel module (noise addition).\n\nPhase 4: Wireless Channel Simulation\nAcademic Mini-Project | Software-Based Wireless Communication Simulator\n\nThis module simulates the physical transmission medium by adding Additive White\nGaussian Noise (AWGN) to a modulated carrier waveform based on a user-selected\nSignal-to-Noise Ratio (SNR in dB).\n\"\"\"\n\nfrom typing import Any, Optional\nimport numpy as np\n\n\ndef add_awgn(\n    signal: Any,\n    snr_db: float,\n    seed: Optional[int] = None,\n) -> np.ndarray:\n    \"\"\"Add Additive White Gaussian Noise (AWGN) to a transmitted signal waveform.\n\n    Mathematical Model:\n        y[n] = x[n] + w[n]\n\n        Where:\n            x[n] is the transmitted discrete-time signal.\n            w[n] ~ N(0, sigma_w^2) is independent zero-mean Gaussian noise.\n            y[n] is the received noisy signal.\n\n        Average signal power:\n            P_x = (1 / N) * sum(x[n]^2)\n\n        Linear SNR:\n            SNR_linear = 10^(SNR_dB / 10)\n\n        Required noise power:\n            P_w = P_x / SNR_linear\n\n        Noise standard deviation:\n            sigma_w = sqrt(P_w)\n\n    Academic Simulation Notice:\n        This is a real-valued AWGN simulation computed mathematically from the\n        waveform's average power. No actual RF hardware, antennas, or physical\n        wireless transmissions occur.\n\n    Args:\n        signal: A 1-dimensional array-like sequence (list, tuple, np.ndarray)\n            of finite numeric values.\n        snr_db: Signal-to-Noise Ratio in decibels. Supported range is [0.0, 30.0] dB.\n        seed: Optional integer seed for the random number generator (useful for\n            reproducible unit testing).\n\n    Returns:\n        np.ndarray: Received noisy signal with the exact same length as the input.\n            Returns an empty float array if the input signal is empty.\n            Returns a copy of the zero signal if the input signal power is 0.\n\n    Raises:\n        TypeError: If signal contains non-numeric values, or if snr_db / seed\n            have invalid types.\n        ValueError: If signal is multidimensional, contains NaN or infinite values,\n            or if snr_db is outside the supported range [0.0, 30.0] dB.\n    \"\"\"\n    # Reject non-sequences\n    if not isinstance(signal, (list, tuple, np.ndarray)):\n        raise TypeError(\n            f\"Input signal must be a list, tuple, or np.ndarray, got {type(signal).__name__}.\"\n        )\n\n    # Convert to NumPy float array and check for non-numeric types\n    try:\n        arr = np.asarray(signal, dtype=float)\n    except (ValueError, TypeError) as err:\n        raise TypeError(f\"Signal must contain numeric values only: {err}\") from err\n\n    # Check dimensionality\n    if arr.ndim != 1:\n        raise ValueError(\n            f\"Input signal must be 1-dimensional, got {arr.ndim} dimensions.\"\n        )\n\n    # Handle empty input array\n    if len(arr) == 0:\n        return np.array([], dtype=float)\n\n    # Check for NaN and Inf\n    if not np.all(np.isfinite(arr)):\n        raise ValueError(\"Signal contains non-finite values (NaN or Inf).\")\n\n    # Validate SNR value\n    if not isinstance(snr_db, (int, float, np.floating, np.integer)) or isinstance(snr_db, bool):\n        raise TypeError(f\"SNR must be a numeric value, got {type(snr_db).__name__}.\")\n    if not np.isfinite(snr_db):\n        raise ValueError(f\"SNR must be a finite number, got {snr_db}.\")\n    if snr_db < 0.0 or snr_db > 30.0:\n        raise ValueError(\n            f\"SNR ({snr_db} dB) is outside the supported range of [0.0, 30.0] dB.\"\n        )\n\n    # Validate seed parameter\n    if seed is not None:\n        if not isinstance(seed, (int, np.integer)) or isinstance(seed, bool):\n            raise TypeError(f\"Seed must be an integer, got {type(seed).__name__}.\")\n\n    # Calculate average signal power P_x\n    p_x = float(np.mean(arr ** 2))\n\n    # A zero-power signal cannot have a defined SNR; return copy unchanged\n    if p_x == 0.0:\n        return arr.copy()\n\n    # Convert SNR from decibels to linear scale\n    snr_linear = 10.0 ** (float(snr_db) / 10.0)\n\n    # Calculate required noise power P_w and standard deviation sigma_w\n    p_w = p_x / snr_linear\n    sigma_w = np.sqrt(p_w)\n\n    # Generate Gaussian noise using independent random number generator\n    rng = np.random.default_rng(seed)\n    noise = rng.normal(loc=0.0, scale=sigma_w, size=len(arr))\n\n    # Received noisy signal y[n] = x[n] + w[n]\n    noisy_signal = arr + noise\n\n    return noisy_signal\n", "src/demodulation.py": "\"\"\"Receiver-side signal demodulation and bit recovery module.\n\nPhase 5: Receiver and Demodulation\nAcademic Mini-Project | Software-Based Wireless Communication Simulator\n\nThis module implements coherent matched-filter and correlation-based\ndemodulation algorithms for:\n- Amplitude Shift Keying (ASK)\n- Frequency Shift Keying (FSK)\n- Binary Phase Shift Keying (BPSK)\n\"\"\"\n\nfrom typing import Any, List\nimport numpy as np\n\n\ndef _validate_common_params(\n    sampling_frequency: float,\n    bit_duration: float,\n    amplitude: float = 1.0,\n) -> int:\n    \"\"\"Validate sampling parameters and calculate samples per bit.\n\n    Args:\n        sampling_frequency: Sampling rate in Hz (> 0).\n        bit_duration: Duration of each bit in seconds (> 0).\n        amplitude: Peak signal amplitude (> 0).\n\n    Returns:\n        int: Samples per bit.\n\n    Raises:\n        ValueError: If any parameter is non-positive.\n    \"\"\"\n    if sampling_frequency <= 0:\n        raise ValueError(\n            f\"Sampling frequency must be positive, got {sampling_frequency}.\"\n        )\n    if bit_duration <= 0:\n        raise ValueError(f\"Bit duration must be positive, got {bit_duration}.\")\n    if amplitude <= 0:\n        raise ValueError(f\"Amplitude must be positive, got {amplitude}.\")\n\n    samples_per_bit = int(round(sampling_frequency * bit_duration))\n    if samples_per_bit <= 0:\n        raise ValueError(\n            f\"Calculated samples per bit is {samples_per_bit}. \"\n            \"Ensure sampling_frequency * bit_duration >= 1.\"\n        )\n    return samples_per_bit\n\n\ndef _validate_received_signal(\n    received_signal: Any,\n    samples_per_bit: int,\n) -> np.ndarray:\n    \"\"\"Validate and sanitize a received discrete-time waveform.\n\n    Args:\n        received_signal: 1D array-like sequence of finite numeric values.\n        samples_per_bit: Number of samples in each bit interval.\n\n    Returns:\n        np.ndarray: Validated 1D float array.\n\n    Raises:\n        TypeError: If signal contains non-numeric types or is not a sequence.\n        ValueError: If signal is multidimensional, contains NaN/Inf, or has a\n            length not divisible by samples_per_bit.\n    \"\"\"\n    if not isinstance(received_signal, (list, tuple, np.ndarray)):\n        raise TypeError(\n            f\"Received signal must be a list, tuple, or np.ndarray, got {type(received_signal).__name__}.\"\n        )\n\n    try:\n        arr = np.asarray(received_signal, dtype=float)\n    except (ValueError, TypeError) as err:\n        raise TypeError(\n            f\"Received signal must contain numeric values only: {err}\"\n        ) from err\n\n    if arr.ndim != 1:\n        raise ValueError(\n            f\"Received signal must be 1-dimensional, got {arr.ndim} dimensions.\"\n        )\n\n    if len(arr) == 0:\n        return np.array([], dtype=float)\n\n    if not np.all(np.isfinite(arr)):\n        raise ValueError(\"Received signal contains non-finite values (NaN or Inf).\")\n\n    if len(arr) % samples_per_bit != 0:\n        raise ValueError(\n            f\"Received signal length ({len(arr)}) is not divisible by samples per bit ({samples_per_bit}). \"\n            \"Incomplete bit interval detected.\"\n        )\n\n    return arr\n\n\ndef ask_demodulate(\n    received_signal: Any,\n    sampling_frequency: float = 10000.0,\n    carrier_frequency: float = 1000.0,\n    bit_duration: float = 0.01,\n    amplitude: float = 1.0,\n) -> List[int]:\n    \"\"\"Demodulate a received ASK signal using matched-filter correlation.\n\n    Mathematical Model:\n        For each bit interval k:\n            s_ref(t) = sin(2 * pi * f_c * t)\n            correlation_k = sum(y[n] * s_ref[n])\n            threshold_k = (A / 2) * sum(s_ref[n]^2)\n\n            Decision rule:\n                bit = 1 if correlation_k > threshold_k else 0\n\n        Threshold Rationale:\n            For binary ASK (On-Off Keying) under AWGN with equal a priori\n            probabilities, the optimal likelihood-ratio decision boundary\n            lies halfway between the expected noiseless responses:\n            E[corr | bit=1] = A * E_carrier, and E[corr | bit=0] = 0.\n            Therefore, the optimal threshold is (A / 2) * E_carrier.\n\n    Args:\n        received_signal: 1D array of discrete signal samples.\n        sampling_frequency: Sampling rate in Hz (default: 10000.0).\n        carrier_frequency: Carrier frequency in Hz (default: 1000.0).\n        bit_duration: Duration of one bit in seconds (default: 0.01).\n        amplitude: Expected peak carrier amplitude for bit 1 (default: 1.0).\n\n    Returns:\n        List[int]: Recovered binary bit sequence (0s and 1s). Returns [] if empty.\n\n    Raises:\n        TypeError, ValueError: If input parameters or signal waveform are invalid.\n    \"\"\"\n    samples_per_bit = _validate_common_params(\n        sampling_frequency, bit_duration, amplitude\n    )\n    arr = _validate_received_signal(received_signal, samples_per_bit)\n    if len(arr) == 0:\n        return []\n\n    if carrier_frequency <= 0:\n        raise ValueError(\n            f\"Carrier frequency must be positive, got {carrier_frequency}.\"\n        )\n    nyquist = sampling_frequency / 2.0\n    if carrier_frequency >= nyquist:\n        raise ValueError(\n            f\"Carrier frequency ({carrier_frequency} Hz) must be strictly below \"\n            f\"Nyquist frequency ({nyquist} Hz).\"\n        )\n\n    num_bits = len(arr) // samples_per_bit\n    t = np.arange(len(arr), dtype=float) / sampling_frequency\n    carrier = np.sin(2.0 * np.pi * carrier_frequency * t)\n\n    # Correlate received signal with coherent reference carrier\n    corr_per_bit = np.sum((arr * carrier).reshape(num_bits, samples_per_bit), axis=1)\n    ref_energy_per_bit = np.sum((carrier ** 2).reshape(num_bits, samples_per_bit), axis=1)\n\n    threshold = (amplitude / 2.0) * ref_energy_per_bit\n    recovered_bits = (corr_per_bit > threshold).astype(int).tolist()\n\n    return recovered_bits\n\n\ndef fsk_demodulate(\n    received_signal: Any,\n    sampling_frequency: float = 10000.0,\n    frequency_0: float = 500.0,\n    frequency_1: float = 1500.0,\n    bit_duration: float = 0.01,\n    amplitude: float = 1.0,\n) -> List[int]:\n    \"\"\"Demodulate a received FSK signal using dual-branch matched filters.\n\n    Mathematical Model:\n        For each bit interval k:\n            corr_0 = sum(y[n] * sin(2 * pi * f_0 * t))\n            corr_1 = sum(y[n] * sin(2 * pi * f_1 * t))\n\n            Decision rule:\n                bit = 1 if corr_1 > corr_0 else 0\n\n        Decision Rationale:\n            Dual coherent correlation branches measure energy alignment with\n            frequency f_0 versus frequency f_1. The maximum correlation\n            statistic identifies the most probable transmitted tone.\n\n    Args:\n        received_signal: 1D array of discrete signal samples.\n        sampling_frequency: Sampling rate in Hz (default: 10000.0).\n        frequency_0: Carrier frequency in Hz for bit 0 (default: 500.0).\n        frequency_1: Carrier frequency in Hz for bit 1 (default: 1500.0).\n        bit_duration: Duration of one bit in seconds (default: 0.01).\n        amplitude: Expected peak carrier amplitude (default: 1.0).\n\n    Returns:\n        List[int]: Recovered binary bit sequence (0s and 1s). Returns [] if empty.\n\n    Raises:\n        TypeError, ValueError: If input parameters or signal waveform are invalid.\n    \"\"\"\n    samples_per_bit = _validate_common_params(\n        sampling_frequency, bit_duration, amplitude\n    )\n    arr = _validate_received_signal(received_signal, samples_per_bit)\n    if len(arr) == 0:\n        return []\n\n    nyquist = sampling_frequency / 2.0\n    if frequency_0 <= 0 or frequency_0 >= nyquist:\n        raise ValueError(\n            f\"Frequency 0 ({frequency_0} Hz) must be positive and below Nyquist ({nyquist} Hz).\"\n        )\n    if frequency_1 <= 0 or frequency_1 >= nyquist:\n        raise ValueError(\n            f\"Frequency 1 ({frequency_1} Hz) must be positive and below Nyquist ({nyquist} Hz).\"\n        )\n    if frequency_0 == frequency_1:\n        raise ValueError(\"frequency_0 and frequency_1 must be distinct for FSK.\")\n\n    num_bits = len(arr) // samples_per_bit\n    t = np.arange(len(arr), dtype=float) / sampling_frequency\n\n    ref_0 = np.sin(2.0 * np.pi * frequency_0 * t)\n    ref_1 = np.sin(2.0 * np.pi * frequency_1 * t)\n\n    corr_0 = np.sum((arr * ref_0).reshape(num_bits, samples_per_bit), axis=1)\n    corr_1 = np.sum((arr * ref_1).reshape(num_bits, samples_per_bit), axis=1)\n\n    recovered_bits = (corr_1 > corr_0).astype(int).tolist()\n\n    return recovered_bits\n\n\ndef bpsk_demodulate(\n    received_signal: Any,\n    sampling_frequency: float = 10000.0,\n    carrier_frequency: float = 1000.0,\n    bit_duration: float = 0.01,\n    amplitude: float = 1.0,\n) -> List[int]:\n    \"\"\"Demodulate a received BPSK signal using coherent phase correlation.\n\n    Coherent Detection Notice:\n        This function implements coherent BPSK detection, assuming an ideal\n        synchronized local reference carrier matching Phase 3 modulation.\n        Carrier recovery and phase estimation are outside the simulator scope.\n\n    Mathematical Model:\n        For each bit interval k:\n            s_ref(t) = sin(2 * pi * f_c * t)\n            corr_k = sum(y[n] * s_ref[n])\n\n            Decision rule:\n                bit = 1 if corr_k >= 0.0 else 0\n\n        Decision Rationale:\n            In Phase 3 BPSK:\n                Bit 1 transmits +A * sin(2 * pi * f_c * t) (correlation > 0)\n                Bit 0 transmits -A * sin(2 * pi * f_c * t) (correlation < 0)\n            The zero boundary (corr_k = 0) provides the optimal maximum-likelihood\n            decision boundary in AWGN. Deterministic tie-breaking assigns 1.\n\n    Args:\n        received_signal: 1D array of discrete signal samples.\n        sampling_frequency: Sampling rate in Hz (default: 10000.0).\n        carrier_frequency: Carrier frequency in Hz (default: 1000.0).\n        bit_duration: Duration of one bit in seconds (default: 0.01).\n        amplitude: Expected peak carrier amplitude (default: 1.0).\n\n    Returns:\n        List[int]: Recovered binary bit sequence (0s and 1s). Returns [] if empty.\n\n    Raises:\n        TypeError, ValueError: If input parameters or signal waveform are invalid.\n    \"\"\"\n    samples_per_bit = _validate_common_params(\n        sampling_frequency, bit_duration, amplitude\n    )\n    arr = _validate_received_signal(received_signal, samples_per_bit)\n    if len(arr) == 0:\n        return []\n\n    if carrier_frequency <= 0:\n        raise ValueError(\n            f\"Carrier frequency must be positive, got {carrier_frequency}.\"\n        )\n    nyquist = sampling_frequency / 2.0\n    if carrier_frequency >= nyquist:\n        raise ValueError(\n            f\"Carrier frequency ({carrier_frequency} Hz) must be strictly below \"\n            f\"Nyquist frequency ({nyquist} Hz).\"\n        )\n\n    num_bits = len(arr) // samples_per_bit\n    t = np.arange(len(arr), dtype=float) / sampling_frequency\n    carrier = np.sin(2.0 * np.pi * carrier_frequency * t)\n\n    corr = np.sum((arr * carrier).reshape(num_bits, samples_per_bit), axis=1)\n\n    # Decide bit 1 for positive correlation, bit 0 for negative correlation\n    recovered_bits = (corr >= 0.0).astype(int).tolist()\n\n    return recovered_bits\n", "src/encoding.py": "\"\"\"Text-to-binary and binary-to-text encoding module.\n\nPhase 2: Binary Data Conversion\nAcademic Mini-Project | Software-Based Wireless Communication Simulator\n\nThis module provides functions to convert text strings to UTF-8 binary bit arrays\nand decode binary bit arrays back to text strings.\n\"\"\"\n\nfrom typing import List\n\n\ndef text_to_bits(text: str) -> List[int]:\n    \"\"\"Convert a text string into a list of UTF-8 bits (0s and 1s).\n\n    Each character in the string is encoded into UTF-8 bytes, and each byte is\n    converted into exactly 8 bits in most-significant-bit (MSB) first order,\n    preserving all leading zeros.\n\n    Args:\n        text (str): The text string to convert. Can include English characters,\n            punctuation, spaces, numbers, and Unicode/accented characters.\n\n    Returns:\n        List[int]: A list of integers (0 and 1) representing the UTF-8 bitstream.\n            Returns an empty list if the input string is empty.\n\n    Raises:\n        TypeError: If the input is not a string.\n\n    Examples:\n        >>> text_to_bits(\"A\")\n        [0, 1, 0, 0, 0, 0, 0, 1]\n        >>> text_to_bits(\"\")\n        []\n    \"\"\"\n    if not isinstance(text, str):\n        raise TypeError(f\"Input text must be a str, got {type(text).__name__}\")\n\n    if not text:\n        return []\n\n    # Encode string to UTF-8 byte sequence\n    utf8_bytes = text.encode(\"utf-8\")\n\n    # Convert each byte to 8 bits, most-significant bit (MSB) first\n    bits: List[int] = []\n    for byte in utf8_bytes:\n        for shift in range(7, -1, -1):\n            bits.append((byte >> shift) & 1)\n\n    return bits\n\n\ndef bits_to_text(bits: List[int]) -> str:\n    \"\"\"Convert a list of UTF-8 bits (0s and 1s) back into a text string.\n\n    Validates that the input contains only integer 0 and 1 values and that its\n    length is an exact multiple of 8 bits. Groups bits into bytes (MSB first)\n    and decodes using UTF-8.\n\n    Args:\n        bits (List[int]): A list of integer bits (0 and 1). Length must be a\n            multiple of 8.\n\n    Returns:\n        str: The recovered UTF-8 text string. Returns an empty string if the\n            input list is empty.\n\n    Raises:\n        TypeError: If the input is not a list.\n        ValueError: If any element in the list is not an integer 0 or 1, or if\n            the total number of bits is not divisible by 8.\n        UnicodeDecodeError: If the recovered bytes do not form a valid UTF-8 sequence.\n\n    Examples:\n        >>> bits_to_text([0, 1, 0, 0, 0, 0, 0, 1])\n        'A'\n        >>> bits_to_text([])\n        ''\n    \"\"\"\n    if not isinstance(bits, list):\n        raise TypeError(f\"Input bits must be a list, got {type(bits).__name__}\")\n\n    if not bits:\n        return \"\"\n\n    # Validate bit values (strictly 0 or 1, not booleans or other types/numbers)\n    for index, bit in enumerate(bits):\n        if type(bit) is not int or bit not in (0, 1):\n            raise ValueError(\n                f\"Invalid bit at index {index}: expected integer 0 or 1, got {bit!r} ({type(bit).__name__})\"\n            )\n\n    # Validate byte boundary (multiple of 8)\n    if len(bits) % 8 != 0:\n        raise ValueError(\n            f\"Bit sequence length ({len(bits)}) is not divisible by 8. Incomplete byte received.\"\n        )\n\n    # Reconstruct bytes from 8-bit groups (MSB first)\n    byte_array = bytearray()\n    for i in range(0, len(bits), 8):\n        byte_val = 0\n        for bit in bits[i : i + 8]:\n            byte_val = (byte_val << 1) | bit\n        byte_array.append(byte_val)\n\n    # Decode bytes as UTF-8 (raises UnicodeDecodeError on invalid sequences)\n    return byte_array.decode(\"utf-8\")\n\n\ndef format_bits_for_display(bits: List[int], group_size: int = 8) -> str:\n    \"\"\"Format a list of bits into space-separated groups of 8 for readable display.\n\n    Args:\n        bits (List[int]): List of bits (0 and 1).\n        group_size (int): Number of bits per group (default is 8).\n\n    Returns:\n        str: Space-separated bit groups, e.g. \"01001000 01100101\".\n    \"\"\"\n    if not bits:\n        return \"\"\n\n    bit_str = \"\".join(str(b) for b in bits)\n    groups = [bit_str[i : i + group_size] for i in range(0, len(bit_str), group_size)]\n    return \" \".join(groups)\n", "src/metrics.py": "\"\"\"Performance metrics module for digital communication analysis.\n\nPhase 6: Performance Analysis: BER and Accuracy\nAcademic Mini-Project | Software-Based Wireless Communication Simulator\n\nThis module provides tools to quantify communication quality by comparing\ntransmitted and received binary bitstreams:\n- count_bit_errors: Counts bit discrepancies\n- calculate_ber: Computes Bit Error Rate (BER)\n- calculate_accuracy: Computes percentage accuracy\n- analyze_transmission: Returns a comprehensive performance summary dictionary\n\"\"\"\n\nfrom typing import Any, Dict, List, Union\nimport numpy as np\n\n\ndef _validate_bit_sequence(seq: Any, name: str = \"Bit sequence\") -> List[int]:\n    \"\"\"Validate and sanitize a binary sequence.\n\n    Args:\n        seq: 1D sequence (list, tuple, np.ndarray) of binary bits (0 or 1).\n        name: Name of the parameter for error reporting.\n\n    Returns:\n        List[int]: Validated list of integer bits (0 or 1).\n\n    Raises:\n        TypeError: If seq is a non-sequence, contains booleans, or non-integer elements.\n        ValueError: If seq is multidimensional, contains NaN/Inf, or values other than 0 and 1.\n    \"\"\"\n    if not isinstance(seq, (list, tuple, np.ndarray)):\n        raise TypeError(\n            f\"{name} must be a list, tuple, or 1D np.ndarray, got {type(seq).__name__}.\"\n        )\n\n    if isinstance(seq, np.ndarray):\n        if seq.ndim != 1:\n            raise ValueError(\n                f\"{name} must be 1-dimensional, got {seq.ndim} dimensions.\"\n            )\n\n    cleaned: List[int] = []\n    for idx, bit in enumerate(seq):\n        # Explicitly reject Python booleans which inherit from int\n        if isinstance(bit, (bool, np.bool_)):\n            raise TypeError(\n                f\"Invalid bit in {name} at index {idx}: boolean values (True/False) are not allowed. \"\n                \"Use integer 0 or 1.\"\n            )\n        if not isinstance(bit, (int, np.integer)):\n            raise TypeError(\n                f\"Invalid bit in {name} at index {idx}: expected integer, got {type(bit).__name__}.\"\n            )\n        val = int(bit)\n        if val not in (0, 1):\n            raise ValueError(\n                f\"Invalid bit value in {name} at index {idx}: expected 0 or 1, got {bit!r}.\"\n            )\n        cleaned.append(val)\n\n    return cleaned\n\n\ndef count_bit_errors(\n    transmitted_bits: Any,\n    received_bits: Any,\n) -> int:\n    \"\"\"Count the number of bit disagreements between transmitted and received sequences.\n\n    Args:\n        transmitted_bits: Sequence of transmitted integer bits (0 or 1).\n        received_bits: Sequence of received integer bits (0 or 1).\n\n    Returns:\n        int: Number of positions where transmitted_bits[i] != received_bits[i].\n            Returns 0 if both sequences are empty.\n\n    Raises:\n        TypeError: If inputs are invalid types or contain booleans / non-integers.\n        ValueError: If sequences have unequal lengths or invalid bit values.\n\n    Examples:\n        >>> count_bit_errors([1, 0, 1, 1, 0, 1], [1, 0, 0, 1, 0, 1])\n        1\n        >>> count_bit_errors([], [])\n        0\n    \"\"\"\n    tx = _validate_bit_sequence(transmitted_bits, \"transmitted_bits\")\n    rx = _validate_bit_sequence(received_bits, \"received_bits\")\n\n    if len(tx) != len(rx):\n        raise ValueError(\n            f\"Transmitted bit count ({len(tx)}) does not match received bit count ({len(rx)}). \"\n            \"Sequences must have equal length to evaluate bit errors.\"\n        )\n\n    if len(tx) == 0:\n        return 0\n\n    return int(np.sum(np.array(tx) != np.array(rx)))\n\n\ndef calculate_ber(\n    transmitted_bits: Any,\n    received_bits: Any,\n) -> float:\n    \"\"\"Calculate the Bit Error Rate (BER) between transmitted and received bitstreams.\n\n    Mathematical Model:\n        BER = Number of bit errors / Total transmitted bits\n\n    Empty Sequence Policy:\n        For two empty sequences (length 0), returns 0.0, representing zero\n        observed errors over a null transmission.\n\n    Args:\n        transmitted_bits: Sequence of transmitted integer bits (0 or 1).\n        received_bits: Sequence of received integer bits (0 or 1).\n\n    Returns:\n        float: Bit Error Rate in the range [0.0, 1.0].\n\n    Raises:\n        TypeError: If inputs contain invalid types.\n        ValueError: If sequence lengths do not match or contain invalid bit values.\n\n    Examples:\n        >>> calculate_ber([1, 0, 1, 1], [1, 0, 0, 1])\n        0.25\n    \"\"\"\n    tx = _validate_bit_sequence(transmitted_bits, \"transmitted_bits\")\n    rx = _validate_bit_sequence(received_bits, \"received_bits\")\n\n    if len(tx) != len(rx):\n        raise ValueError(\n            f\"Transmitted bit count ({len(tx)}) does not match received bit count ({len(rx)}).\"\n        )\n\n    if len(tx) == 0:\n        return 0.0\n\n    errors = count_bit_errors(tx, rx)\n    return float(errors / len(tx))\n\n\ndef calculate_accuracy(\n    transmitted_bits: Any,\n    received_bits: Any,\n) -> float:\n    \"\"\"Calculate bit transmission accuracy as a percentage.\n\n    Mathematical Model:\n        Accuracy (%) = (1.0 - BER) * 100.0\n\n    Empty Sequence Policy:\n        For two empty sequences, returns 100.0%, consistent with BER = 0.0.\n\n    Args:\n        transmitted_bits: Sequence of transmitted integer bits (0 or 1).\n        received_bits: Sequence of received integer bits (0 or 1).\n\n    Returns:\n        float: Accuracy percentage in the range [0.0, 100.0].\n\n    Raises:\n        TypeError, ValueError: If inputs are invalid or lengths do not match.\n\n    Examples:\n        >>> calculate_accuracy([1, 0, 1, 1], [1, 0, 0, 1])\n        75.0\n    \"\"\"\n    ber = calculate_ber(transmitted_bits, received_bits)\n    return float((1.0 - ber) * 100.0)\n\n\ndef analyze_transmission(\n    transmitted_bits: Any,\n    received_bits: Any,\n) -> Dict[str, Union[int, float]]:\n    \"\"\"Generate a comprehensive metrics summary of the transmission pipeline.\n\n    Args:\n        transmitted_bits: Sequence of transmitted integer bits (0 or 1).\n        received_bits: Sequence of received integer bits (0 or 1).\n\n    Returns:\n        Dict with keys:\n            - 'total_bits' (int): Total number of transmitted bits.\n            - 'recovered_bits' (int): Total number of recovered bits.\n            - 'bit_errors' (int): Number of bit discrepancies.\n            - 'ber' (float): Bit Error Rate [0.0, 1.0].\n            - 'accuracy_percent' (float): Transmission accuracy percentage [0.0, 100.0].\n\n    Raises:\n        TypeError, ValueError: If sequences are invalid or lengths do not match.\n\n    Examples:\n        >>> summary = analyze_transmission([1, 0, 1, 1, 0, 1], [1, 0, 0, 1, 0, 1])\n        >>> summary['bit_errors']\n        1\n        >>> round(summary['accuracy_percent'], 2)\n        83.33\n    \"\"\"\n    tx = _validate_bit_sequence(transmitted_bits, \"transmitted_bits\")\n    rx = _validate_bit_sequence(received_bits, \"received_bits\")\n\n    if len(tx) != len(rx):\n        raise ValueError(\n            f\"Transmitted bits ({len(tx)}) and recovered bits ({len(rx)}) have unequal lengths. \"\n            \"Cannot compute bit-by-bit error statistics.\"\n        )\n\n    errors = count_bit_errors(tx, rx)\n    total = len(tx)\n    ber = float(errors / total) if total > 0 else 0.0\n    accuracy = float((1.0 - ber) * 100.0)\n\n    return {\n        \"total_bits\": total,\n        \"recovered_bits\": len(rx),\n        \"bit_errors\": errors,\n        \"ber\": ber,\n        \"accuracy_percent\": accuracy,\n    }\n", "src/modulation.py": "\"\"\"Digital signal modulation module.\n\nPhase 3: Digital Signal Modulation\nAcademic Mini-Project | Software-Based Wireless Communication Simulator\n\nThis module implements discrete-time mathematical modulation for:\n- Amplitude Shift Keying (ASK)\n- Frequency Shift Keying (FSK)\n- Binary Phase Shift Keying (BPSK)\n\"\"\"\n\nfrom typing import Any, List, Sequence, Union\nimport numpy as np\n\n\ndef _validate_bits(bits: Any) -> List[int]:\n    \"\"\"Validate and sanitize a binary sequence input.\n\n    Args:\n        bits: A 1D sequence (list, tuple, or 1D np.ndarray) of binary bits (0 or 1).\n\n    Returns:\n        List[int]: A validated list of integer bits (0 or 1).\n\n    Raises:\n        TypeError: If input is not a sequence, contains booleans, or non-integer elements.\n        ValueError: If input is multidimensional or contains values other than 0 and 1.\n    \"\"\"\n    # Reject non-sequences\n    if not isinstance(bits, (list, tuple, np.ndarray)):\n        raise TypeError(\n            f\"Input bits must be a list, tuple, or 1D numpy array, got {type(bits).__name__}.\"\n        )\n\n    # Check numpy array dimensionality\n    if isinstance(bits, np.ndarray):\n        if bits.ndim != 1:\n            raise ValueError(\n                f\"Input bits array must be 1-dimensional, got {bits.ndim} dimensions.\"\n            )\n\n    cleaned: List[int] = []\n    for idx, bit in enumerate(bits):\n        # Python bool is a subclass of int, so explicitly reject booleans\n        if isinstance(bit, (bool, np.bool_)):\n            raise TypeError(\n                f\"Invalid bit at index {idx}: boolean values (True/False) are not allowed. \"\n                \"Use integer 0 or 1.\"\n            )\n        # Verify integer type\n        if not isinstance(bit, (int, np.integer)):\n            raise TypeError(\n                f\"Invalid bit at index {idx}: expected integer, got {type(bit).__name__}.\"\n            )\n        val = int(bit)\n        if val not in (0, 1):\n            raise ValueError(\n                f\"Invalid bit value at index {idx}: expected 0 or 1, got {bit!r}.\"\n            )\n        cleaned.append(val)\n\n    return cleaned\n\n\ndef _validate_common_params(\n    sampling_frequency: float,\n    bit_duration: float,\n    amplitude: float,\n) -> int:\n    \"\"\"Validate common signal parameters and calculate samples per bit.\n\n    Args:\n        sampling_frequency: Sampling rate in Hz (> 0).\n        bit_duration: Duration of each bit in seconds (> 0).\n
