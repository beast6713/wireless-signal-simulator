       amplitude: Peak signal amplitude (>= 0).\n\n    Returns:\n        int: Number of discrete samples per bit.\n\n    Raises:\n        ValueError: If any parameter is out of valid bounds.\n    \"\"\"\n    if sampling_frequency <= 0:\n        raise ValueError(\n            f\"Sampling frequency must be positive, got {sampling_frequency}.\"\n        )\n    if bit_duration <= 0:\n        raise ValueError(f\"Bit duration must be positive, got {bit_duration}.\")\n    if amplitude < 0:\n        raise ValueError(f\"Amplitude must be non-negative, got {amplitude}.\")\n\n    samples_per_bit = int(round(sampling_frequency * bit_duration))\n    if samples_per_bit <= 0:\n        raise ValueError(\n            f\"Calculated samples per bit is {samples_per_bit}. \"\n            \"Ensure sampling_frequency * bit_duration >= 1.\"\n        )\n    return samples_per_bit\n\n\ndef ask_modulate(\n    bits: Union[Sequence[int], np.ndarray],\n    sampling_frequency: float = 10000.0,\n    carrier_frequency: float = 1000.0,\n    bit_duration: float = 0.01,\n    amplitude: float = 1.0,\n) -> np.ndarray:\n    \"\"\"Modulate a binary sequence using Amplitude Shift Keying (ASK).\n\n    Mathematical Model:\n        s(t) = A * sin(2 * pi * f_c * t)  when bit = 1\n        s(t) = 0                           when bit = 0\n\n    Args:\n        bits: Binary sequence of 0s and 1s.\n        sampling_frequency: Sampling rate in Hz (default: 10000.0).\n        carrier_frequency: Carrier wave frequency in Hz (default: 1000.0).\n        bit_duration: Time duration of one bit in seconds (default: 0.01).\n        amplitude: Peak amplitude for bit 1 (default: 1.0).\n\n    Returns:\n        np.ndarray: Discrete-time modulated signal waveform. Returns an empty\n            array if bits is empty.\n\n    Raises:\n        TypeError, ValueError: If input parameters or bits are invalid.\n    \"\"\"\n    validated_bits = _validate_bits(bits)\n    if not validated_bits:\n        return np.array([], dtype=float)\n\n    samples_per_bit = _validate_common_params(\n        sampling_frequency, bit_duration, amplitude\n    )\n\n    if carrier_frequency <= 0:\n        raise ValueError(\n            f\"Carrier frequency must be positive, got {carrier_frequency}.\"\n        )\n    nyquist = sampling_frequency / 2.0\n    if carrier_frequency >= nyquist:\n        raise ValueError(\n            f\"Carrier frequency ({carrier_frequency} Hz) must be strictly below \"\n            f\"Nyquist frequency ({nyquist} Hz).\"\n        )\n\n    total_samples = len(validated_bits) * samples_per_bit\n    # Time vector starting at 0 and not including the endpoint of the full duration\n    t = np.arange(total_samples, dtype=float) / sampling_frequency\n\n    # Expand bits across the duration of each bit\n    bit_stream = np.repeat(validated_bits, samples_per_bit)\n\n    # ASK: Multiply carrier by the bit stream (1 for carrier, 0 for silence)\n    carrier = amplitude * np.sin(2.0 * np.pi * carrier_frequency * t)\n    waveform = bit_stream * carrier\n\n    return waveform\n\n\ndef fsk_modulate(\n    bits: Union[Sequence[int], np.ndarray],\n    sampling_frequency: float = 10000.0,\n    frequency_0: float = 500.0,\n    frequency_1: float = 1500.0,\n    bit_duration: float = 0.01,\n    amplitude: float = 1.0,\n) -> np.ndarray:\n    \"\"\"Modulate a binary sequence using Frequency Shift Keying (FSK).\n\n    Mathematical Model:\n        s(t) = A * sin(2 * pi * f_b * t)\n        where f_b = frequency_0 for bit 0, and f_b = frequency_1 for bit 1.\n\n    Continuous time t is maintained across the entire signal.\n\n    Args:\n        bits: Binary sequence of 0s and 1s.\n        sampling_frequency: Sampling rate in Hz (default: 10000.0).\n        frequency_0: Carrier frequency in Hz for bit 0 (default: 500.0).\n        frequency_1: Carrier frequency in Hz for bit 1 (default: 1500.0).\n        bit_duration: Time duration of one bit in seconds (default: 0.01).\n        amplitude: Peak amplitude of the carrier wave (default: 1.0).\n\n    Returns:\n        np.ndarray: Discrete-time modulated signal waveform. Returns an empty\n            array if bits is empty.\n\n    Raises:\n        TypeError, ValueError: If input parameters or bits are invalid.\n    \"\"\"\n    validated_bits = _validate_bits(bits)\n    if not validated_bits:\n        return np.array([], dtype=float)\n\n    samples_per_bit = _validate_common_params(\n        sampling_frequency, bit_duration, amplitude\n    )\n\n    nyquist = sampling_frequency / 2.0\n    if frequency_0 <= 0 or frequency_0 >= nyquist:\n        raise ValueError(\n            f\"Frequency for bit 0 ({frequency_0} Hz) must be positive and below \"\n            f\"Nyquist frequency ({nyquist} Hz).\"\n        )\n    if frequency_1 <= 0 or frequency_1 >= nyquist:\n        raise ValueError(\n            f\"Frequency for bit 1 ({frequency_1} Hz) must be positive and below \"\n            f\"Nyquist frequency ({nyquist} Hz).\"\n        )\n    if frequency_0 == frequency_1:\n        raise ValueError(\n            f\"frequency_0 ({frequency_0} Hz) and frequency_1 ({frequency_1} Hz) \"\n            \"must be distinct for FSK.\"\n        )\n\n    total_samples = len(validated_bits) * samples_per_bit\n    t = np.arange(total_samples, dtype=float) / sampling_frequency\n\n    # Assign frequency per sample based on each bit\n    bit_stream = np.repeat(validated_bits, samples_per_bit)\n    freq_stream = np.where(bit_stream == 1, frequency_1, frequency_0)\n\n    waveform = amplitude * np.sin(2.0 * np.pi * freq_stream * t)\n\n    return waveform\n\n\ndef bpsk_modulate(\n    bits: Union[Sequence[int], np.ndarray],\n    sampling_frequency: float = 10000.0,\n    carrier_frequency: float = 1000.0,\n    bit_duration: float = 0.01,\n    amplitude: float = 1.0,\n) -> np.ndarray:\n    \"\"\"Modulate a binary sequence using Binary Phase Shift Keying (BPSK).\n\n    Mathematical Model:\n        s(t) = A * sin(2 * pi * f_c * t + phi_b)\n        where phi_b = 0 for bit 1, and phi_b = pi for bit 0.\n\n    Args:\n        bits: Binary sequence of 0s and 1s.\n        sampling_frequency: Sampling rate in Hz (default: 10000.0).\n        carrier_frequency: Carrier wave frequency in Hz (default: 1000.0).\n        bit_duration: Time duration of one bit in seconds (default: 0.01).\n        amplitude: Peak amplitude of the carrier wave (default: 1.0).\n\n    Returns:\n        np.ndarray: Discrete-time modulated signal waveform. Returns an empty\n            array if bits is empty.\n\n    Raises:\n        TypeError, ValueError: If input parameters or bits are invalid.\n    \"\"\"\n    validated_bits = _validate_bits(bits)\n    if not validated_bits:\n        return np.array([], dtype=float)\n\n    samples_per_bit = _validate_common_params(\n        sampling_frequency, bit_duration, amplitude\n    )\n\n    if carrier_frequency <= 0:\n        raise ValueError(\n            f\"Carrier frequency must be positive, got {carrier_frequency}.\"\n        )\n    nyquist = sampling_frequency / 2.0\n    if carrier_frequency >= nyquist:\n        raise ValueError(\n            f\"Carrier frequency ({carrier_frequency} Hz) must be strictly below \"\n            f\"Nyquist frequency ({nyquist} Hz).\"\n        )\n\n    total_samples = len(validated_bits) * samples_per_bit\n    t = np.arange(total_samples, dtype=float) / sampling_frequency\n\n    # Assign phase: phi = 0 for bit 1, phi = pi for bit 0\n    bit_stream = np.repeat(validated_bits, samples_per_bit)\n    phase_stream = np.where(bit_stream == 1, 0.0, np.pi)\n\n    waveform = amplitude * np.sin(2.0 * np.pi * carrier_frequency * t + phase_stream)\n\n    return waveform\n\n\ndef get_time_vector(\n    num_bits: int,\n    sampling_frequency: float = 10000.0,\n    bit_duration: float = 0.01,\n) -> np.ndarray:\n    \"\"\"Generate the discrete time vector for a given number of bits.\n\n    Args:\n        num_bits: Total number of bits.\n        sampling_frequency: Sampling rate in Hz (default: 10000.0).\n        bit_duration: Bit duration in seconds (default: 0.01).\n\n    Returns:\n        np.ndarray: Time array starting at 0.0 and ending before total duration.\n    \"\"\"\n    if num_bits <= 0:\n        return np.array([], dtype=float)\n    samples_per_bit = _validate_common_params(sampling_frequency, bit_duration, 1.0)\n    total_samples = num_bits * samples_per_bit\n    return np.arange(total_samples, dtype=float) / sampling_frequency\n", "src/visualization.py": "\"\"\"Signal plotting and waveform visualization module.\n\nPhase 7: Signal Visualization and Results Dashboard\nAcademic Mini-Project | Software-Based Wireless Communication Simulator\n\nThis module provides reusable Matplotlib plotting functions for:\n- Modulated carrier waveforms\n- Received noisy waveforms (AWGN)\n- Synchronized signal comparison (transmitted vs. received)\n- Binary bitstream comparison (step plot showing bit errors)\n\"\"\"\n\nfrom typing import Any, List, Optional\nimport matplotlib.pyplot as plt\nimport numpy as np\n\n\ndef _validate_signal(signal: Any, name: str = \"Signal\") -> np.ndarray:\n    \"\"\"Validate and sanitize a 1D numeric signal array.\n\n    Args:\n        signal: 1D array-like sequence of finite numeric values.\n        name: Name of signal for descriptive error messages.\n\n    Returns:\n        np.ndarray: 1D float numpy array.\n\n    Raises:\n        TypeError: If signal contains non-numeric elements or is not a sequence.\n        ValueError: If signal is empty, multidimensional, or contains NaN/Inf.\n    \"\"\"\n    if not isinstance(signal, (list, tuple, np.ndarray)):\n        raise TypeError(\n            f\"{name} must be a list, tuple, or np.ndarray, got {type(signal).__name__}.\"\n        )\n\n    try:\n        arr = np.asarray(signal, dtype=float)\n    except (ValueError, TypeError) as err:\n        raise TypeError(f\"{name} must contain numeric values only: {err}\") from err\n\n    if arr.ndim != 1:\n        raise ValueError(f\"{name} must be 1-dimensional, got {arr.ndim} dimensions.\")\n\n    if len(arr) == 0:\n        raise ValueError(f\"{name} cannot be empty.\")\n\n    if not np.all(np.isfinite(arr)):\n        raise ValueError(f\"{name} contains non-finite values (NaN or Inf).\")\n\n    return arr\n\n\ndef _validate_bits(bits: Any, name: str = \"Bit sequence\") -> List[int]:\n    \"\"\"Validate a binary bit sequence containing only integer 0 and 1.\n\n    Args:\n        bits: 1D sequence of binary bits.\n        name: Name of sequence for error messages.\n\n    Returns:\n        List[int]: Validated integer bits.\n\n    Raises:\n        TypeError: If sequence contains booleans or non-integers.\n        ValueError: If sequence is empty, multidimensional, or contains non-binary values.\n    \"\"\"\n    if not isinstance(bits, (list, tuple, np.ndarray)):\n        raise TypeError(\n            f\"{name} must be a list, tuple, or np.ndarray, got {type(bits).__name__}.\"\n        )\n\n    if isinstance(bits, np.ndarray) and bits.ndim != 1:\n        raise ValueError(f\"{name} must be 1-dimensional, got {bits.ndim} dimensions.\")\n\n    if len(bits) == 0:\n        raise ValueError(f\"{name} cannot be empty.\")\n\n    cleaned: List[int] = []\n    for idx, b in enumerate(bits):\n        if isinstance(b, (bool, np.bool_)):\n            raise TypeError(\n                f\"Invalid bit in {name} at index {idx}: booleans are not allowed.\"\n            )\n        if not isinstance(b, (int, np.integer)):\n            raise TypeError(\n                f\"Invalid bit in {name} at index {idx}: expected integer, got {type(b).__name__}.\"\n            )\n        val = int(b)\n        if val not in (0, 1):\n            raise ValueError(\n                f\"Invalid bit value in {name} at index {idx}: expected 0 or 1, got {b!r}.\"\n            )\n        cleaned.append(val)\n\n    return cleaned\n\n\ndef plot_modulated_signal(\n    signal: Any,\n    sample_rate: float,\n    title: str = \"Modulated Signal\",\n    max_samples: Optional[int] = None,\n) -> plt.Figure:\n    \"\"\"Plot the transmitted modulated signal waveform against time in seconds.\n\n    Args:\n        signal: 1D array of discrete signal samples.\n        sample_rate: Sampling frequency in Hz (> 0).\n        title: Plot title (default: \"Modulated Signal\").\n        max_samples: Optional limit on the number of samples plotted for visual clarity.\n\n    Returns:\n        plt.Figure: Matplotlib figure ready for rendering in Streamlit.\n\n    Raises:\n        ValueError, TypeError: If signal or sample_rate is invalid.\n    \"\"\"\n    arr = _validate_signal(signal, \"Modulated signal\")\n    if sample_rate <= 0:\n        raise ValueError(f\"Sample rate must be positive, got {sample_rate}.\")\n\n    if max_samples is not None and max_samples > 0:\n        arr = arr[:max_samples]\n\ndef _style_figure(fig: plt.Figure) -> None:\n    \"\"\"Apply modern telemetry dark styling to figure.\"\"\"\n    fig.patch.set_facecolor(\"#0b1329\")\n\n\ndef _style_axis(ax: plt.Axes, title: Optional[str] = None) -> None:\n    \"\"\"Apply futuristic oscilloscope dark styling to an axis.\"\"\"\n    ax.set_facecolor(\"#0f172a\")\n    if title:\n        ax.set_title(title, fontsize=11, fontweight=\"bold\", color=\"#f8fafc\", pad=8)\n    ax.tick_params(colors=\"#94a3b8\", labelsize=8.5)\n    ax.xaxis.label.set_color(\"#cbd5e1\")\n    ax.yaxis.label.set_color(\"#cbd5e1\")\n    for spine in ax.spines.values():\n        spine.set_color(\"#334155\")\n        spine.set_linewidth(0.8)\n    ax.grid(True, linestyle=\":\", color=\"#334155\", alpha=0.55)\n\n\ndef _style_legend(ax: plt.Axes, loc: str = \"upper right\") -> None:\n    \"\"\"Style legend box for dark theme.\"\"\"\n    legend = ax.legend(loc=loc, fontsize=8.5, facecolor=\"#1e293b\", edgecolor=\"#334155\")\n    if legend:\n        for text in legend.get_texts():\n            text.set_color(\"#f1f5f9\")\n\n\ndef plot_modulated_signal(\n    signal: Any,\n    sample_rate: float,\n    title: str = \"Modulated Signal\",\n    max_samples: Optional[int] = None,\n) -> plt.Figure:\n    \"\"\"Plot the transmitted modulated signal waveform against time in seconds.\n\n    Args:\n        signal: 1D array of discrete signal samples.\n        sample_rate: Sampling frequency in Hz (> 0).\n        title: Plot title (default: \"Modulated Signal\").\n        max_samples: Optional limit on the number of samples plotted for visual clarity.\n\n    Returns:\n        plt.Figure: Matplotlib figure ready for rendering in Streamlit.\n\n    Raises:\n        ValueError, TypeError: If signal or sample_rate is invalid.\n    \"\"\"\n    arr = _validate_signal(signal, \"Modulated signal\")\n    if sample_rate <= 0:\n        raise ValueError(f\"Sample rate must be positive, got {sample_rate}.\")\n\n    if max_samples is not None and max_samples > 0:\n        arr = arr[:max_samples]\n\n    t = np.arange(len(arr), dtype=float) / sample_rate\n\n    fig, ax = plt.subplots(figsize=(10, 3.2), layout=\"constrained\")\n    _style_figure(fig)\n    _style_axis(ax, title)\n\n    ax.plot(t, arr, color=\"#38bdf8\", linewidth=1.4, label=\"Modulated Carrier (Tx)\")\n    ax.set_xlabel(\"Time (s)\", fontsize=9)\n    ax.set_ylabel(\"Amplitude\", fontsize=9)\n    ax.set_ylim(-1.3, 1.3)\n    _style_legend(ax)\n\n    return fig\n\n\ndef plot_received_signal(\n    signal: Any,\n    sample_rate: float,\n    title: str = \"Received Signal with AWGN Noise\",\n    max_samples: Optional[int] = None,\n) -> plt.Figure:\n    \"\"\"Plot the noisy received waveform against time after passing through the AWGN channel.\n\n    Args:\n        signal: 1D array of noisy received signal samples.\n        sample_rate: Sampling frequency in Hz (> 0).\n        title: Plot title (default: \"Received Signal with AWGN Noise\").\n        max_samples: Optional limit on the number of samples plotted.\n\n    Returns:\n        plt.Figure: Matplotlib figure ready for rendering in Streamlit.\n\n    Raises:\n        ValueError, TypeError: If signal or sample_rate is invalid.\n    \"\"\"\n    arr = _validate_signal(signal, \"Received signal\")\n    if sample_rate <= 0:\n        raise ValueError(f\"Sample rate must be positive, got {sample_rate}.\")\n\n    if max_samples is not None and max_samples > 0:\n        arr = arr[:max_samples]\n\n    t = np.arange(len(arr), dtype=float) / sample_rate\n\n    fig, ax = plt.subplots(figsize=(10, 3.2), layout=\"constrained\")\n    _style_figure(fig)\n    _style_axis(ax, title)\n\n    ax.plot(t, arr, color=\"#f43f5e\", linewidth=1.1, label=\"Received Signal (AWGN Rx)\")\n    ax.set_xlabel(\"Time (s)\", fontsize=9)\n    ax.set_ylabel(\"Amplitude\", fontsize=9)\n    _style_legend(ax)\n\n    return fig\n\n\ndef plot_bit_comparison(\n    transmitted_bits: Any,\n    received_bits: Any,\n    max_bits: Optional[int] = None,\n) -> plt.Figure:\n    \"\"\"Plot transmitted and recovered bits using synchronized step plots to highlight errors.\n\n    Args:\n        transmitted_bits: Sequence of transmitted integer bits (0 or 1).\n        received_bits: Sequence of recovered integer bits (0 or 1).\n        max_bits: Optional limit on the number of bits plotted for clarity.\n\n    Returns:\n        plt.Figure: Matplotlib figure comparing transmitted and recovered bitstreams.\n\n    Raises:\n        ValueError, TypeError: If bit sequences are invalid or have incompatible lengths.\n    \"\"\"\n    tx = _validate_bits(transmitted_bits, \"Transmitted bits\")\n    rx = _validate_bits(received_bits, \"Received bits\")\n\n    if len(tx) != len(rx):\n        raise ValueError(\n            f\"Bit sequences must have identical lengths: transmitted ({len(tx)}) vs received ({len(rx)}).\"\n        )\n\n    if max_bits is not None and max_bits > 0:\n        tx = tx[:max_bits]\n        rx = rx[:max_bits]\n\n    n = len(tx)\n    step_x = np.arange(n + 1)\n    step_tx = np.append(tx, tx[-1])\n    step_rx = np.append(rx, rx[-1])\n\n    # Identify bit discrepancy positions\n    error_indices = [i for i in range(n) if tx[i] != rx[i]]\n\n    fig, (ax_tx, ax_rx) = plt.subplots(\n        2, 1, figsize=(10, 3.8), sharex=True, layout=\"constrained\"\n    )\n    _style_figure(fig)\n    _style_axis(ax_tx, \"Transmitted vs. Recovered Binary Bitstream\")\n    _style_axis(ax_rx)\n\n    # Subplot 1: Transmitted Bits\n    ax_tx.step(step_x, step_tx, where=\"post\", color=\"#38bdf8\", linewidth=1.6, label=\"Transmitted Bits\")\n    ax_tx.set_ylabel(\"Tx Level\", fontsize=9)\n    ax_tx.set_ylim(-0.25, 1.25)\n    ax_tx.set_yticks([0, 1])\n    _style_legend(ax_tx)\n\n    # Subplot 2: Recovered Bits\n    ax_rx.step(step_x, step_rx, where=\"post\", color=\"#34d399\", linewidth=1.6, label=\"Recovered Bits\")\n    # Highlight bit errors with vibrant red cross markers\n    if error_indices:\n        err_x = [i + 0.5 for i in error_indices]\n        err_y = [rx[i] for i in error_indices]\n        ax_rx.scatter(\n            err_x, err_y, color=\"#ef4444\", s=70, zorder=5, marker=\"x\", linewidths=2.2, label=\"Bit Error\"\n        )\n    ax_rx.set_xlabel(\"Bit Index\", fontsize=9)\n    ax_rx.set_ylabel(\"Rx Level\", fontsize=9)\n    ax_rx.set_ylim(-0.25, 1.25)\n    ax_rx.set_yticks([0, 1])\n    _style_legend(ax_rx)\n\n    return fig\n\n\ndef plot_signal_comparison(\n    modulated_signal: Any,\n    received_signal: Any,\n    sample_rate: float,\n    max_samples: Optional[int] = None,\n) -> plt.Figure:\n    \"\"\"Plot the transmitted and received noisy waveforms side-by-side on synchronized axes.\n\n    Args:\n        modulated_signal: 1D array of clean modulated samples.\n        received_signal: 1D array of noisy received samples.\n        sample_rate: Sampling frequency in Hz (> 0).\n        max_samples: Optional limit on the number of samples plotted for clarity.\n\n    Returns:\n        plt.Figure: Matplotlib figure displaying both signals for direct visual comparison.\n\n    Raises:\n        ValueError, TypeError: If signals are invalid or lengths do not match.\n    \"\"\"\n    tx = _validate_signal(modulated_signal, \"Modulated signal\")\n    rx = _validate_signal(received_signal, \"Received signal\")\n\n    if len(tx) != len(rx):\n        raise ValueError(\n            f\"Signal lengths must be equal for comparison: modulated ({len(tx)}) vs received ({len(rx)}).\"\n        )\n\n    if sample_rate <= 0:\n        raise ValueError(f\"Sample rate must be positive, got {sample_rate}.\")\n\n    if max_samples is not None and max_samples > 0:\n        tx = tx[:max_samples]\n        rx = rx[:max_samples]\n\n    t = np.arange(len(tx), dtype=float) / sample_rate\n\n    fig, (ax_top, ax_bot) = plt.subplots(\n        2, 1, figsize=(10, 4.4), sharex=True, layout=\"constrained\"\n    )\n    _style_figure(fig)\n    _style_axis(ax_top, \"Signal Comparison: Transmitter vs. Channel Output\")\n    _style_axis(ax_bot)\n\n    # Subplot 1: Clean Transmitted Waveform\n    ax_top.plot(t, tx, color=\"#38bdf8\", linewidth=1.3, label=\"Clean Carrier (Tx)\")\n    ax_top.set_ylabel(\"Amplitude\", fontsize=9)\n    ax_top.set_ylim(-1.3, 1.3)\n    _style_legend(ax_top)\n\n    # Subplot 2: Noisy Received Waveform\n    ax_bot.plot(t, rx, color=\"#f43f5e\", linewidth=1.1, alpha=0.9, label=\"Noisy Received Signal (AWGN)\")\n    ax_bot.plot(t, tx, color=\"#38bdf8\", linestyle=\"--\", linewidth=0.9, alpha=0.6, label=\"Clean Reference\")\n    ax_bot.set_xlabel(\"Time (s)\", fontsize=9)\n    ax_bot.set_ylabel(\"Amplitude\", fontsize=9)\n    _style_legend(ax_bot)\n\n    return fig\n"};

    mount(
